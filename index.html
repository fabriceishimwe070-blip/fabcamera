<!DOCTYPE html>
<html>
<head>
  <title>Firebase Video Call</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
    video { background: #000; border-radius: 10px; margin: 10px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<h2>WebRTC Video Call</h2>

<video id="localVideo" autoplay playsinline width="300" muted></video>
<video id="remoteVideo" autoplay playsinline width="300"></video>

<br><br>

<button onclick="startCall()">Start Call</button>
<button onclick="joinCall()">Join Call</button>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCwibtCkdEl0sHBiFbgbImjYM3dWG1Kopg",
  authDomain: "web-cam-c4d2c.firebaseapp.com",
  projectId: "web-cam-c4d2c",
  storageBucket: "web-cam-c4d2c.firebasestorage.app",
  messagingSenderId: "984503419504",
  appId: "1:984503419504:web:6ce08f1fec6d0e4758aab5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const roomId = prompt("Enter Room ID");

const servers = {
  iceServers: [
    {
      urls: [
        "stun:stun.l.google.com:19302",
        "stun:stun1.l.google.com:19302",
        "stun:stun2.l.google.com:19302",
        "stun:stun3.l.google.com:19302"
      ]
    },
    {
      urls: "stun:stun.stunprotocol.org"
    },
    {
      urls: "stun:stun.services.mozilla.com"
    }
  ]
};

let pc;
let localStream;
let remoteStream;

async function getMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: true
  });

  remoteStream = new MediaStream();

  document.getElementById("localVideo").srcObject = localStream;
  document.getElementById("remoteVideo").srcObject = remoteStream;
}

function createPeer(roomRef, isCaller) {
  pc = new RTCPeerConnection(servers);

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.ontrack = (event) => {
    event.streams[0].getTracks().forEach(track => {
      remoteStream.addTrack(track);
    });
  };

  const candidatesRef = roomRef.collection(
    isCaller ? "callerCandidates" : "calleeCandidates"
  );

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      candidatesRef.add(event.candidate.toJSON());
    }
  };

  pc.onconnectionstatechange = () => {
    console.log("Connection:", pc.connectionState);
  };
}

async function startCall() {
  await getMedia();

  const roomRef = db.collection("rooms").doc(roomId);

  createPeer(roomRef, true);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await roomRef.set({
    offer: {
      type: offer.type,
      sdp: offer.sdp
    }
  });

  roomRef.onSnapshot(async snapshot => {
    const data = snapshot.data();
    if (data?.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
  });

  roomRef.collection("calleeCandidates").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
      }
    });
  });
}

async function joinCall() {
  await getMedia();

  const roomRef = db.collection("rooms").doc(roomId);

  const roomSnapshot = await roomRef.get();

  if (!roomSnapshot.exists) {
    alert("Room does not exist");
    return;
  }

  createPeer(roomRef, false);

  const data = roomSnapshot.data();

  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await roomRef.update({
    answer: {
      type: answer.type,
      sdp: answer.sdp
    }
  });

  roomRef.collection("callerCandidates").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
      }
    });
  });
}
</script>

</body>
</html>

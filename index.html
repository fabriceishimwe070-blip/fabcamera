<!DOCTYPE html>
<html>
<head>
  <title>Firebase Video Call</title>
</head>
<body>

<h2>WebRTC Video Call</h2>

<video id="localVideo" autoplay playsinline width="300"></video>
<video id="remoteVideo" autoplay playsinline width="300"></video>

<br><br>

<button onclick="startCall()">Start Call</button>
<button onclick="joinCall()">Join Call</button>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyCwibtCkdEl0sHBiFbgbImjYM3dWG1Kopg",
  authDomain: "web-cam-c4d2c.firebaseapp.com",
  projectId: "web-cam-c4d2c",
  storageBucket: "web-cam-c4d2c.firebasestorage.app",
  messagingSenderId: "984503419504",
  appId: "1:984503419504:web:6ce08f1fec6d0e4758aab5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const servers = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

let pc;
let localStream;

const roomId = "room1";

async function getMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: true
  });

  document.getElementById("localVideo").srcObject = localStream;
}

function setupRemoteStream() {
  const remoteStream = new MediaStream();
  document.getElementById("remoteVideo").srcObject = remoteStream;

  pc.ontrack = (event) => {
    event.streams[0].getTracks().forEach(track => {
      remoteStream.addTrack(track);
    });
  };
}

function setupIce(roomRef, sender, receiver) {
  const senderCandidates = roomRef.collection(sender);
  const receiverCandidates = roomRef.collection(receiver);

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      senderCandidates.add(event.candidate.toJSON());
    }
  };

  receiverCandidates.onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
      }
    });
  });
}

async function startCall() {
  await getMedia();

  pc = new RTCPeerConnection(servers);
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  const roomRef = db.collection("rooms").doc(roomId);

  setupRemoteStream();
  setupIce(roomRef, "callerCandidates", "calleeCandidates");

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await roomRef.set({
    offer: {
      type: offer.type,
      sdp: offer.sdp
    }
  });

  roomRef.onSnapshot(async (snapshot) => {
    const data = snapshot.data();
    if (data?.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(data.answer);
    }
  });
}

async function joinCall() {
  await getMedia();

  pc = new RTCPeerConnection(servers);
  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  const roomRef = db.collection("rooms").doc(roomId);

  setupRemoteStream();
  setupIce(roomRef, "calleeCandidates", "callerCandidates");

  const roomData = (await roomRef.get()).data();

  await pc.setRemoteDescription(roomData.offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await roomRef.update({
    answer: {
      type: answer.type,
      sdp: answer.sdp
    }
  });
}

</script>

</body>
</html>

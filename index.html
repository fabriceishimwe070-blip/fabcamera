<!DOCTYPE html>
<html>
<head>
  <title>Video Call</title>
  <style>
    body { text-align: center; font-family: Arial; background: #f2f2f2; }
    video { width: 300px; margin: 10px; background: black; border-radius: 10px; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; }
  </style>
</head>
<body>

<h2>Simple Video Call</h2>

<input id="room" placeholder="Enter Room ID">
<br>

<button onclick="startCall()">Start Call</button>
<button onclick="joinCall()">Join Call</button>

<br><br>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
let localStream;
let peer;
let call;

async function getMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById("localVideo").srcObject = localStream;
}

function startCall() {
  const id = document.getElementById("room").value;
  peer = new Peer(id);

  peer.on("open", async () => {
    await getMedia();
  });

  peer.on("call", (incomingCall) => {
    incomingCall.answer(localStream);

    incomingCall.on("stream", (remoteStream) => {
      document.getElementById("remoteVideo").srcObject = remoteStream;
    });
  });
}

async function joinCall() {
  const id = document.getElementById("room").value;

  peer = new Peer();

  peer.on("open", async () => {
    await getMedia();

    call = peer.call(id, localStream);

    call.on("stream", (remoteStream) => {
      document.getElementById("remoteVideo").srcObject = remoteStream;
    });
  });
}
</script>

</body>
</html>

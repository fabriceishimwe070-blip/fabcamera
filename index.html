<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAB-CAMERA</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <style>
    /* Multi-user grid */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      width: 100%;
    }
    .remote-tile {
      position: relative;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
    }
    .remote-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .remote-tile .peer-label {
      position: absolute;
      bottom: 8px;
      left: 10px;
      background: rgba(0,0,0,0.55);
      color: #fff;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 20px;
      font-family: 'Space Mono', monospace;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .remote-tile .remove-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: rgba(200,50,50,0.7);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 13px;
      cursor: pointer;
      line-height: 22px;
      text-align: center;
      padding: 0;
    }
    /* Participants list */
    .participants-list {
      margin-top: 10px;
      font-size: 12px;
      color: #aaa;
    }
    .participants-list span {
      display: inline-block;
      background: rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 2px 8px;
      margin: 2px 3px;
      font-family: 'Space Mono', monospace;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">ISHIMWE</div>
    <div class="status-badge" id="statusBadge">
      <div class="status-dot"></div>
      <span id="statusText">Offline</span>
    </div>
  </header>

  <div class="setup-panel">
    <div class="field-group">
      <label>Your Peer ID</label>
      <div class="id-display">
        <span class="id-text" id="myId">—</span>
        <button class="copy-btn" onclick="copyId()" title="Copy ID">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="startBtn" onclick="startPeer()">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
          </svg>
          Start Camera
        </button>
      </div>
    </div>

    <div class="field-group">
      <label>Call a Peer ID</label>
      <input type="text" id="peerId" placeholder="Paste friend's Peer ID…">
      <div class="btn-row">
        <button class="btn btn-call" id="callBtn" onclick="callPeer()" disabled>
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          Call
        </button>
        <button class="btn btn-end" id="endBtn" onclick="endAllCalls()" disabled>
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12 12 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.43 19.43 0 0 1-3.61-3.61m-1.72-6.1A19.79 19.79 0 0 1 2 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12 12 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91M23 1 1 23"/>
          </svg>
          End All
        </button>
      </div>

      <!-- Participants currently connected -->
      <div class="participants-list" id="participantsList"></div>
    </div>
  </div>

  <!-- Local PiP always visible after camera starts -->
  <div class="local-pip" id="localPip" style="display:none; position:relative; margin-bottom:10px; width:200px; border-radius:12px; overflow:hidden;">
    <video id="localVideo" autoplay muted playsinline style="width:100%;display:block;"></video>
    <div class="pip-label">You</div>
  </div>

  <!-- Remote video grid -->
  <div class="video-stage">
    <div class="empty-state" id="emptyState">
      <svg width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
      </svg>
      <p>No active calls</p>
      <small>Start camera, then call peers to connect</small>
    </div>
    <div class="video-grid" id="videoGrid"></div>
  </div>

  <div class="controls-bar">
    <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" disabled title="Mute mic">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="videoBtn" onclick="toggleVideo()" disabled title="Camera on/off">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="Fullscreen">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>
</div>

<!-- Incoming call overlay (plays ringtone only on receiver side) -->
<div class="incoming-overlay" id="incomingOverlay">
  <div class="incoming-card">
    <div class="ring-icon">
      <svg width="36" height="36" fill="white" viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </div>
    <h3>Incoming Call</h3>
    <p id="callerIdText">Unknown caller</p>
    <div class="incoming-actions">
      <button class="btn-accept" onclick="acceptCall()">Accept</button>
      <button class="btn-decline" onclick="declineCall()">Decline</button>
    </div>
  </div>
</div>

<!-- Ringtone — plays only when incoming call arrives -->
<audio id="ringtone" src="iphone-ringtone.mp3" loop></audio>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  
  let peer = null;
  let localStream = null;
  let isMuted = false, isVideoOff = false;

  // Map of peerId → MediaConnection (active calls)
  const activeCalls = new Map();

  // Queue of pending incoming calls (caller id → MediaConnection)
  const pendingCalls = [];

 
  const ICE_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80",        username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443",       username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
    ]
  };


  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (type ? ' ' + type : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  
  async function startPeer() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.textContent = 'Starting…';

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('localVideo').srcObject = localStream;
      document.getElementById('localPip').style.display = 'block';

      peer = new Peer(undefined, { config: ICE_CONFIG });

      peer.on('open', (id) => {
        document.getElementById('myId').textContent = id;
        setStatus('connected', 'Ready');
        document.getElementById('callBtn').disabled = false;
        document.getElementById('muteBtn').disabled = false;
        document.getElementById('videoBtn').disabled = false;
        btn.textContent = '✓ Camera On';
        showToast('Camera ready! Share your ID to receive calls.', 'success');
      });

      
      peer.on('call', (incomingCall) => {
        // If this peer is already connected, auto-answer (mesh join)
        if (activeCalls.size > 0) {
          answerCall(incomingCall);
          return;
        }
        // First call — show overlay + ring
        pendingCalls.push(incomingCall);
        document.getElementById('callerIdText').textContent = incomingCall.peer;
        document.getElementById('incomingOverlay').classList.add('show');
        playRingtone();
      });

      peer.on('error', (err) => {
        showToast('Peer error: ' + err.type, 'error');
        console.error(err);
      });

    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = `<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/></svg> Start Camera`;
      showToast('Camera access denied.', 'error');
    }
  }

 
  function playRingtone() {
    const aud = document.getElementById('ringtone');
    aud.currentTime = 0;
    aud.play().catch(() => {});
  }
  function stopRingtone() {
    const aud = document.getElementById('ringtone');
    aud.pause();
    aud.currentTime = 0;
  }

  
  function callPeer() {
    const id = document.getElementById('peerId').value.trim();
    if (!id) { showToast('Enter a Peer ID to call.', 'error'); return; }
    if (!peer || !localStream) { showToast('Start camera first.', 'error'); return; }
    if (activeCalls.has(id)) { showToast('Already connected to that peer.', 'error'); return; }

    const call = peer.call(id, localStream);
    if (!call) { showToast('Could not reach that peer.', 'error'); return; }

    setupCallHandlers(call);
    setStatus('connected', 'Calling…');
    showToast('Calling ' + id + '…');
    document.getElementById('peerId').value = '';
  }

 
  function acceptCall() {
    stopRingtone();
    document.getElementById('incomingOverlay').classList.remove('show');
    const call = pendingCalls.shift();
    if (!call) return;
    answerCall(call);
    // Process any remaining queued calls
    while (pendingCalls.length > 0) {
      answerCall(pendingCalls.shift());
    }
  }

  function answerCall(call) {
    call.answer(localStream);
    setupCallHandlers(call);
    showToast('Call connected!', 'success');
  }

  function declineCall() {
    stopRingtone();
    document.getElementById('incomingOverlay').classList.remove('show');
    pendingCalls.length = 0;
    showToast('Call declined.');
  }

  
  function setupCallHandlers(call) {
    const peerId = call.peer;

    call.on('stream', (remoteStream) => {
      // Don't re-add if already present
      if (activeCalls.has(peerId)) return;

      activeCalls.set(peerId, call);
      addRemoteTile(peerId, remoteStream);
      updateParticipantsList();
      document.getElementById('endBtn').disabled = false;
      setStatus('connected', `In call (${activeCalls.size})`);
      showToast('Connected to ' + peerId, 'success');
    });

  
    call.on('close', () => {
      removeRemoteTile(peerId);
      activeCalls.delete(peerId);
      updateParticipantsList();
      showToast(peerId.substring(0, 8) + '… left the call.');
      if (activeCalls.size === 0) {
        setStatus('connected', 'Ready');
        document.getElementById('endBtn').disabled = true;
      } else {
        setStatus('connected', `In call (${activeCalls.size})`);
      }
    });

    call.on('error', (err) => {
      removeRemoteTile(peerId);
      activeCalls.delete(peerId);
      updateParticipantsList();
      showToast('Call error with ' + peerId.substring(0,8) + '…: ' + err, 'error');
    });
  }

 
  function addRemoteTile(peerId, remoteStream) {
    const grid = document.getElementById('videoGrid');
    document.getElementById('emptyState').classList.add('hidden');

    const tile = document.createElement('div');
    tile.className = 'remote-tile';
    tile.id = 'tile-' + peerId;

    const vid = document.createElement('video');
    vid.autoplay = true;
    vid.playsInline = true;
    vid.srcObject = remoteStream;
    vid.play().catch(() => {});

    const label = document.createElement('div');
    label.className = 'peer-label';
    label.textContent = peerId;

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.title = 'Disconnect this peer';
    removeBtn.textContent = '✕';
    removeBtn.onclick = () => disconnectPeer(peerId);

    tile.appendChild(vid);
    tile.appendChild(label);
    tile.appendChild(removeBtn);
    grid.appendChild(tile);
  }

  function removeRemoteTile(peerId) {
    const tile = document.getElementById('tile-' + peerId);
    if (tile) tile.remove();
    if (document.getElementById('videoGrid').children.length === 0) {
      document.getElementById('emptyState').classList.remove('hidden');
    }
  }

  
  function disconnectPeer(peerId) {
    const call = activeCalls.get(peerId);
    if (call) call.close();
    removeRemoteTile(peerId);
    activeCalls.delete(peerId);
    updateParticipantsList();
    showToast('Disconnected from ' + peerId.substring(0,8) + '…');
    if (activeCalls.size === 0) {
      setStatus('connected', 'Ready');
      document.getElementById('endBtn').disabled = true;
    } else {
      setStatus('connected', `In call (${activeCalls.size})`);
    }
  }

 
  function endAllCalls() {
    activeCalls.forEach((call, id) => {
      call.close();
      removeRemoteTile(id);
    });
    activeCalls.clear();
    updateParticipantsList();
    setStatus('connected', 'Ready');
    document.getElementById('endBtn').disabled = true;
    document.getElementById('emptyState').classList.remove('hidden');
    showToast('All calls ended. Camera still active.');
    /* NOTE: localStream is NOT stopped — your camera keeps running */
  }

  
  function updateParticipantsList() {
    const el = document.getElementById('participantsList');
    if (activeCalls.size === 0) { el.innerHTML = ''; return; }
    el.innerHTML = 'Connected: ' + [...activeCalls.keys()].map(id =>
      `<span title="${id}">${id.substring(0,8)}…</span>`
    ).join('');
  }

 
  function toggleMute() {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    document.getElementById('muteBtn').classList.toggle('active', isMuted);
    showToast(isMuted ? 'Microphone muted' : 'Microphone on');
  }

  function toggleVideo() {
    if (!localStream) return;
    isVideoOff = !isVideoOff;
    localStream.getVideoTracks().forEach(t => t.enabled = !isVideoOff);
    document.getElementById('videoBtn').classList.toggle('active', isVideoOff);
    showToast(isVideoOff ? 'Camera off' : 'Camera on');
  }

  function toggleFullscreen() {
    const stage = document.querySelector('.video-stage');
    if (!document.fullscreenElement) {
      stage.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }

 
  function copyId() {
    const id = document.getElementById('myId').textContent;
    if (id === '—') { showToast('Start camera to get your ID first.', 'error'); return; }
    navigator.clipboard.writeText(id).then(() => showToast('ID copied!', 'success'));
  }

 
  function setStatus(type, text) {
    const badge = document.getElementById('statusBadge');
    const label = document.getElementById('statusText');
    badge.className = 'status-badge ' + type;
    label.textContent = text;
  }
</script>
</body>
</html>

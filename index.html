<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAB-CAMERA</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0c;
      --surface: #111114;
      --border: rgba(255,255,255,0.08);
      --accent: #00e5a0;
      --accent2: #0099ff;
      --text: #e8e8ec;
      --muted: #888;
      --danger: #ff4444;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 10;
      background: rgba(10,10,12,0.92);
      backdrop-filter: blur(12px);
    }
    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.12em;
      color: var(--accent);
    }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-badge.connected .status-dot { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    /* ── Main layout ──────────────────────────────────────── */
    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────────── */
    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }
    .field-group { display: flex; flex-direction: column; gap: 8px; }
    .field-group label {
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .id-display {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
    }
    .id-text {
      flex: 1;
      font-size: 11px;
      color: var(--accent);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .copy-btn {
      background: none; border: none; cursor: pointer;
      color: var(--muted); padding: 2px; display: flex; align-items: center;
      transition: color .2s;
    }
    .copy-btn:hover { color: var(--accent); }

    input[type="text"] {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      outline: none;
      transition: border-color .2s;
    }
    input[type="text"]:focus { border-color: var(--accent2); }
    input[type="text"]::placeholder { color: var(--muted); }

    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      border: none; cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      transition: opacity .2s, transform .1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: .35; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-call    { background: var(--accent2); color: #fff; }
    .btn-end     { background: var(--danger); color: #fff; }

    .divider {
      height: 1px;
      background: var(--border);
    }

    .participants-list {
      display: flex; flex-direction: column; gap: 4px;
    }
    .participants-list .peer-pill {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.04);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 10px;
    }
    .peer-pill .peer-name { color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
    .peer-pill .kick-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 12px; padding: 0 2px; transition: color .2s;
    }
    .peer-pill .kick-btn:hover { color: var(--danger); }

    /* ── Controls at sidebar bottom ───────────────────────── */
    .ctrl-group {
      margin-top: auto;
      display: flex; gap: 8px;
    }
    .ctrl-btn {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      padding: 10px 0;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .2s, color .2s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.1); }
    .ctrl-btn.active { background: rgba(255,68,68,0.15); color: var(--danger); border-color: rgba(255,68,68,0.3); }
    .ctrl-btn:disabled { opacity: .3; cursor: not-allowed; }

    /* ── Video stage ──────────────────────────────────────── */
    .video-stage {
      flex: 1;
      position: relative;
      background: #050507;
      overflow: hidden;
    }

    /* Empty state */
    .empty-state {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px; color: var(--muted);
      pointer-events: none;
    }
    .empty-state p { font-size: 14px; }
    .empty-state small { font-size: 11px; opacity: .6; }
    .empty-state.hidden { display: none; }

    /* Remote video grid — fills the stage */
    .video-grid {
      width: 100%; height: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 4px;
    }
    .remote-tile {
      position: relative;
      background: #111;
      overflow: hidden;
    }
    .remote-tile video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .remote-tile .peer-label {
      position: absolute; bottom: 10px; left: 12px;
      background: rgba(0,0,0,0.6);
      color: #fff; font-size: 11px;
      padding: 3px 10px; border-radius: 20px;
      max-width: 85%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .remote-tile .remove-btn {
      position: absolute; top: 8px; right: 10px;
      background: rgba(200,50,50,0.7);
      border: none; color: #fff;
      border-radius: 50%; width: 24px; height: 24px;
      font-size: 13px; cursor: pointer;
      line-height: 24px; text-align: center; padding: 0;
      opacity: 0; transition: opacity .2s;
    }
    .remote-tile:hover .remove-btn { opacity: 1; }

    /* ── Local PiP (corner) ───────────────────────────────── */
    #localPip {
      position: absolute;
      bottom: 16px; right: 16px;
      width: 160px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      z-index: 20;
      display: none;
      cursor: pointer;
      transition: transform .2s;
    }
    #localPip:hover { transform: scale(1.04); }
    #localPip video { width: 100%; display: block; }
    #localPip .pip-label {
      position: absolute; bottom: 6px; left: 8px;
      font-size: 10px; color: rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.45);
      padding: 1px 7px; border-radius: 10px;
    }
    #localPip.pip-hidden { display: none !important; }

    /* PiP toggle button */
    #pipToggle {
      position: absolute;
      bottom: 16px; right: 184px;
      z-index: 20;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: var(--muted);
      padding: 6px 10px;
      font-size: 10px;
      cursor: pointer;
      display: none;
      font-family: 'Space Mono', monospace;
      transition: color .2s;
    }
    #pipToggle:hover { color: var(--text); }

    /* ── Incoming overlay ─────────────────────────────────── */
    .incoming-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      opacity: 0; pointer-events: none;
      transition: opacity .3s;
    }
    .incoming-overlay.show { opacity: 1; pointer-events: all; }
    .incoming-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 28px;
      text-align: center;
      min-width: 260px;
    }
    .ring-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      animation: ring-pulse 1s ease-in-out infinite;
    }
    @keyframes ring-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,229,160,0.4); }
      50%       { box-shadow: 0 0 0 14px rgba(0,229,160,0); }
    }
    .incoming-card h3 { font-family: 'Syne', sans-serif; font-size: 18px; margin-bottom: 6px; }
    .incoming-card p  { font-size: 11px; color: var(--muted); margin-bottom: 20px; word-break: break-all; }
    .incoming-actions { display: flex; gap: 10px; }
    .btn-accept, .btn-decline {
      flex: 1; padding: 10px; border-radius: 10px; border: none;
      cursor: pointer; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 12px;
    }
    .btn-accept  { background: var(--accent); color: #000; }
    .btn-decline { background: rgba(255,68,68,0.15); color: var(--danger); border: 1px solid rgba(255,68,68,0.3); }

    /* ── Toast ────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: rgba(20,20,24,0.95);
      border: 1px solid var(--border);
      color: var(--text); font-size: 12px;
      padding: 8px 18px; border-radius: 20px;
      z-index: 200; opacity: 0;
      transition: opacity .25s, transform .25s;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(0,229,160,0.4); color: var(--accent); }
    .toast.error   { border-color: rgba(255,68,68,0.4);  color: var(--danger); }
  </style>
</head>
<body>

<header>
  <div class="logo">ISHIMWE</div>
  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">Offline</span>
  </div>
</header>

<div class="main">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">

    <div class="field-group">
      <label>Your Peer ID</label>
      <div class="id-display">
        <span class="id-text" id="myId">—</span>
        <button class="copy-btn" onclick="copyId()" title="Copy ID">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="startBtn" onclick="startPeer()">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
          </svg>
          Start Camera
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="field-group">
      <label>Call a Peer</label>
      <input type="text" id="peerId" placeholder="Paste friend's Peer ID…">
      <div class="btn-row">
        <button class="btn btn-call" id="callBtn" onclick="callPeer()" disabled>
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
          </svg>
          Call
        </button>
        <button class="btn btn-end" id="endBtn" onclick="endAllCalls()" disabled>
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12 12 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.43 19.43 0 0 1-3.61-3.61m-1.72-6.1A19.79 19.79 0 0 1 2 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12 12 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91M23 1 1 23"/>
          </svg>
          End All
        </button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="field-group">
      <label>Connected (<span id="peerCount">0</span>)</label>
      <div class="participants-list" id="participantsList"></div>
    </div>

    <!-- Media controls pinned to bottom -->
    <div class="ctrl-group">
      <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" disabled title="Mute mic">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
        </svg>
      </button>
      <button class="ctrl-btn" id="videoBtn" onclick="toggleVideo()" disabled title="Camera on/off">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
        </svg>
      </button>
      <button class="ctrl-btn" onclick="toggleFullscreen()" title="Fullscreen">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>
    </div>

  </aside>

  <!-- ── Video Stage (remote fills this) ── -->
  <div class="video-stage" id="videoStage">

    <div class="empty-state" id="emptyState">
      <svg width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.2" opacity=".4">
        <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
      </svg>
      <p>No active calls</p>
      <small>Start your camera, then call a peer</small>
    </div>

    <!-- Remote peers render here -->
    <div class="video-grid" id="videoGrid"></div>

    <!-- Local PiP — bottom-right corner of stage -->
    <div id="localPip">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="pip-label">You</div>
    </div>

    <!-- Toggle local PiP visibility -->
    <button id="pipToggle" onclick="togglePip()">Hide me</button>

  </div>
</div>

<!-- Incoming call overlay -->
<div class="incoming-overlay" id="incomingOverlay">
  <div class="incoming-card">
    <div class="ring-icon">
      <svg width="30" height="30" fill="white" viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </div>
    <h3>Incoming Call</h3>
    <p id="callerIdText">Unknown caller</p>
    <div class="incoming-actions">
      <button class="btn-accept" onclick="acceptCall()">Accept</button>
      <button class="btn-decline" onclick="declineCall()">Decline</button>
    </div>
  </div>
</div>

<audio id="ringtone" src="iphone-ringtone.mp3" loop></audio>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  let peer = null;
  let localStream = null;
  let isMuted = false, isVideoOff = false, isPipHidden = false;

  const activeCalls = new Map();
  const pendingCalls = [];

  const ICE_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80",             username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443",            username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443?transport=tcp", username: "openrelayproject", credential: "openrelayproject" }
    ]
  };

  // ── Toast ──────────────────────────────────────────────────
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (type ? ' ' + type : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Start camera & peer ────────────────────────────────────
  async function startPeer() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.textContent = 'Starting…';

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });

      // Show local video in PiP corner
      document.getElementById('localVideo').srcObject = localStream;
      document.getElementById('localPip').style.display = 'block';
      document.getElementById('pipToggle').style.display = 'block';

      peer = new Peer(undefined, { config: ICE_CONFIG });

      peer.on('open', (id) => {
        document.getElementById('myId').textContent = id;
        setStatus('connected', 'Ready');
        document.getElementById('callBtn').disabled = false;
        document.getElementById('muteBtn').disabled = false;
        document.getElementById('videoBtn').disabled = false;
        btn.textContent = '✓ Camera On';
        showToast('Camera ready! Share your ID.', 'success');
      });

      peer.on('call', (incomingCall) => {
        if (activeCalls.size > 0) {
          answerCall(incomingCall);
          return;
        }
        pendingCalls.push(incomingCall);
        document.getElementById('callerIdText').textContent = incomingCall.peer;
        document.getElementById('incomingOverlay').classList.add('show');
        playRingtone();
      });

      peer.on('error', (err) => {
        showToast('Peer error: ' + err.type, 'error');
        console.error(err);
      });

    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Start Camera';
      showToast('Camera access denied.', 'error');
    }
  }

  // ── Ringtone ───────────────────────────────────────────────
  function playRingtone() {
    const a = document.getElementById('ringtone');
    a.currentTime = 0; a.play().catch(() => {});
  }
  function stopRingtone() {
    const a = document.getElementById('ringtone');
    a.pause(); a.currentTime = 0;
  }

  // ── Call out ───────────────────────────────────────────────
  function callPeer() {
    const id = document.getElementById('peerId').value.trim();
    if (!id)          { showToast('Enter a Peer ID to call.', 'error'); return; }
    if (!peer || !localStream) { showToast('Start camera first.', 'error'); return; }
    if (activeCalls.has(id))   { showToast('Already connected to that peer.', 'error'); return; }

    const call = peer.call(id, localStream);
    if (!call) { showToast('Could not reach that peer.', 'error'); return; }

    setupCallHandlers(call);
    setStatus('connected', 'Calling…');
    showToast('Calling ' + id + '…');
    document.getElementById('peerId').value = '';
  }

  // ── Accept / Decline ───────────────────────────────────────
  function acceptCall() {
    stopRingtone();
    document.getElementById('incomingOverlay').classList.remove('show');
    const call = pendingCalls.shift();
    if (!call) return;
    answerCall(call);
    while (pendingCalls.length > 0) answerCall(pendingCalls.shift());
  }

  function answerCall(call) {
    call.answer(localStream);
    setupCallHandlers(call);
    showToast('Call connected!', 'success');
  }

  function declineCall() {
    stopRingtone();
    document.getElementById('incomingOverlay').classList.remove('show');
    pendingCalls.length = 0;
    showToast('Call declined.');
  }

  // ── Wire up a call ─────────────────────────────────────────
  function setupCallHandlers(call) {
    const peerId = call.peer;

    call.on('stream', (remoteStream) => {
      if (activeCalls.has(peerId)) return;
      activeCalls.set(peerId, call);

      // ▶ Remote stream goes into the main stage grid
      addRemoteTile(peerId, remoteStream);
      updateParticipantsList();
      document.getElementById('endBtn').disabled = false;
      setStatus('connected', `In call (${activeCalls.size})`);
      showToast('Connected to ' + peerId, 'success');
    });

    call.on('close', () => {
      removeRemoteTile(peerId);
      activeCalls.delete(peerId);
      updateParticipantsList();
      showToast(peerId.substring(0, 8) + '… left the call.');
      if (activeCalls.size === 0) {
        setStatus('connected', 'Ready');
        document.getElementById('endBtn').disabled = true;
      } else {
        setStatus('connected', `In call (${activeCalls.size})`);
      }
    });

    call.on('error', (err) => {
      removeRemoteTile(peerId);
      activeCalls.delete(peerId);
      updateParticipantsList();
      showToast('Call error: ' + err, 'error');
    });
  }

  // ── Remote tile ────────────────────────────────────────────
  function addRemoteTile(peerId, remoteStream) {
    document.getElementById('emptyState').classList.add('hidden');

    const tile = document.createElement('div');
    tile.className = 'remote-tile';
    tile.id = 'tile-' + peerId;

    const vid = document.createElement('video');
    vid.autoplay = true;
    vid.playsInline = true;
    vid.srcObject = remoteStream;   // ← remote stream is the main display
    vid.play().catch(() => {});

    const label = document.createElement('div');
    label.className = 'peer-label';
    label.textContent = peerId;

    const removeBtn = document.createElement('button');
    removeBtn.className = 'remove-btn';
    removeBtn.title = 'Disconnect';
    removeBtn.textContent = '✕';
    removeBtn.onclick = () => disconnectPeer(peerId);

    tile.appendChild(vid);
    tile.appendChild(label);
    tile.appendChild(removeBtn);
    document.getElementById('videoGrid').appendChild(tile);
  }

  function removeRemoteTile(peerId) {
    const tile = document.getElementById('tile-' + peerId);
    if (tile) tile.remove();
    if (!document.getElementById('videoGrid').children.length) {
      document.getElementById('emptyState').classList.remove('hidden');
    }
  }

  
  function disconnectPeer(peerId) {
    const call = activeCalls.get(peerId);
    if (call) call.close();
    removeRemoteTile(peerId);
    activeCalls.delete(peerId);
    updateParticipantsList();
    showToast('Disconnected from ' + peerId.substring(0, 8) + '…');
    if (activeCalls.size === 0) {
      setStatus('connected', 'Ready');
      document.getElementById('endBtn').disabled = true;
    } else {
      setStatus('connected', `In call (${activeCalls.size})`);
    }
  }

 
  function endAllCalls() {
    activeCalls.forEach((call, id) => { call.close(); removeRemoteTile(id); });
    activeCalls.clear();
    updateParticipantsList();
    setStatus('connected', 'Ready');
    document.getElementById('endBtn').disabled = true;
    document.getElementById('emptyState').classList.remove('hidden');
    showToast('All calls ended. Camera still active.');
  }

 
  function updateParticipantsList() {
    const el = document.getElementById('participantsList');
    document.getElementById('peerCount').textContent = activeCalls.size;
    el.innerHTML = '';
    activeCalls.forEach((_, id) => {
      const pill = document.createElement('div');
      pill.className = 'peer-pill';
      pill.innerHTML = `<span class="peer-name" title="${id}">${id.substring(0,10)}…</span>
        <button class="kick-btn" onclick="disconnectPeer('${id}')" title="Disconnect">✕</button>`;
      el.appendChild(pill);
    });
  }

 
  function togglePip() {
    isPipHidden = !isPipHidden;
    const pip = document.getElementById('localPip');
    const btn = document.getElementById('pipToggle');
    pip.style.display = isPipHidden ? 'none' : 'block';
    btn.textContent = isPipHidden ? 'Show me' : 'Hide me';
  }

 
  function toggleMute() {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    document.getElementById('muteBtn').classList.toggle('active', isMuted);
    showToast(isMuted ? 'Microphone muted' : 'Microphone on');
  }

  function toggleVideo() {
    if (!localStream) return;
    isVideoOff = !isVideoOff;
    localStream.getVideoTracks().forEach(t => t.enabled = !isVideoOff);
    document.getElementById('videoBtn').classList.toggle('active', isVideoOff);
    showToast(isVideoOff ? 'Camera off' : 'Camera on');
  }

  function toggleFullscreen() {
    const stage = document.getElementById('videoStage');
    if (!document.fullscreenElement) stage.requestFullscreen().catch(() => {});
    else document.exitFullscreen();
  }

  
  function copyId() {
    const id = document.getElementById('myId').textContent;
    if (id === '—') { showToast('Start camera first.', 'error'); return; }
    navigator.clipboard.writeText(id).then(() => showToast('ID copied!', 'success'));
  }

  function setStatus(type, text) {
    document.getElementById('statusBadge').className = 'status-badge ' + type;
    document.getElementById('statusText').textContent = text;
  }
</script>
</body>
</html>

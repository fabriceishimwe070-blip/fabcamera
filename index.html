<!DOCTYPE html>
<html>
<head>
  <title>PeerJS Video Call</title>
  <style>
    body { text-align: center; font-family: Arial; background: #f2f2f2; }
    video { width: 300px; margin: 10px; background: black; border-radius: 10px; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; }
  </style>
</head>
<body>

<h2>PeerJS Video Call</h2>

<input id="peerId" placeholder="Enter Friend ID">
<br>

<button onclick="start()">Start</button>
<button onclick="callPeer()">Call</button>

<br><br>

<p>Your ID: <span id="myId">...</span></p>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
let localStream;
let peer;
let currentCall;

async function start() {
  peer = new Peer();

  peer.on("open", async (id) => {
    document.getElementById("myId").innerText = id;

    localStream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: true
    });

    const localVideo = document.getElementById("localVideo");
    localVideo.srcObject = localStream;
    localVideo.onloadedmetadata = () => {
      localVideo.play();
    };
  });

  peer.on("call", (call) => {
    call.answer(localStream);

    call.on("stream", (remoteStream) => {
      const remoteVideo = document.getElementById("remoteVideo");
      remoteVideo.srcObject = remoteStream;
      remoteVideo.onloadedmetadata = () => {
        remoteVideo.play().catch(() => {});
      };
    });

    currentCall = call;
  });
}

function callPeer() {
  const id = document.getElementById("peerId").value;
  if (!id) return alert("Enter Friend ID");

  const call = peer.call(id, localStream);

  call.on("stream", (remoteStream) => {
    const remoteVideo = document.getElementById("remoteVideo");
    remoteVideo.srcObject = remoteStream;
    remoteVideo.onloadedmetadata = () => {
      remoteVideo.play().catch(() => {});
    };
  });

  currentCall = call;
}
</script>

</body>
</html>

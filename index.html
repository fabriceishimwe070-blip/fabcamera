<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NovaMeet — Instant Video Rooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    :root {
      --bg:          #080b12;
      --surface:     #0e1420;
      --surface2:    #141b2d;
      --border:      rgba(255,255,255,0.07);
      --accent:      #00e5ff;
      --accent2:     #7c3aed;
      --accent-glow: rgba(0,229,255,0.18);
      --danger:      #ff4757;
      --text:        #e8ecf4;
      --muted:       #6b7899;
      --radius:      14px;
      --transition:  0.35s cubic-bezier(0.4,0,0.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
    }

    button { cursor: pointer; border: none; outline: none; font-family: inherit; }
    input  { font-family: 'DM Mono', monospace; outline: none; border: none; }

    .bg-canvas {
      position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    }
    .bg-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
      background-size: 60px 60px;
    }
    .orb {
      position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.18;
      animation: orbFloat 12s ease-in-out infinite alternate;
    }
    .orb-1 { width: 600px; height: 600px; background: var(--accent2); top: -200px; left: -150px; }
    .orb-2 { width: 400px; height: 400px; background: var(--accent); bottom: -100px; right: -100px; animation-delay: -4s; }
    .orb-3 { width: 300px; height: 300px; background: #1e40af; top: 40%; left: 40%; animation-delay: -8s; }
    @keyframes orbFloat {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    #landing {
      position: relative; z-index: 10;
      display: flex; flex-direction: column; align-items: center;
      padding: 4rem 2rem 6rem;
      min-height: 100vh;
      transition: opacity var(--transition), transform var(--transition);
    }
    #landing.hiding {
      opacity: 0;
      transform: scale(0.96) translateY(-20px);
      pointer-events: none;
    }

    .logo {
      display: flex; align-items: center; gap: 12px; margin-bottom: 3.5rem;
    }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 24px var(--accent-glow);
    }
    .logo-icon svg { width: 26px; height: 26px; fill: #fff; }
    .logo-name { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
    .logo-name span { color: var(--accent); }

    .tagline {
      font-size: clamp(2rem, 5vw, 3.8rem);
      font-weight: 800; text-align: center;
      line-height: 1.1; letter-spacing: -1px;
      max-width: 700px; margin-bottom: 1.2rem;
    }
    .tagline em { font-style: normal; color: var(--accent); }

    .sub {
      font-family: 'DM Mono', monospace; font-size: 0.95rem;
      color: var(--muted); text-align: center; margin-bottom: 3rem;
    }

    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 2.2rem 2.5rem;
      width: min(460px, 100%); backdrop-filter: blur(20px);
      box-shadow: 0 24px 80px rgba(0,0,0,0.4);
    }

    .tabs {
      display: flex; gap: 6px; margin-bottom: 1.8rem;
      background: var(--bg); border-radius: 10px; padding: 5px;
    }
    .tab-btn {
      flex: 1; padding: 0.6rem; border-radius: 7px;
      font-family: 'Syne', sans-serif; font-weight: 600; font-size: 0.9rem;
      color: var(--muted); background: transparent; transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--surface2); color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .input-group {
      display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.2rem;
    }
    .input-group label {
      font-size: 0.8rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
    }
    .input-wrap {
      display: flex; align-items: center;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 0 1rem; transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--accent); }
    .input-wrap input {
      flex: 1; background: transparent; color: var(--text);
      padding: 0.85rem 0.5rem; font-size: 0.95rem;
    }
    .input-wrap input::placeholder { color: var(--muted); }
    .copy-btn {
      background: none; color: var(--muted); font-size: 0.8rem;
      padding: 4px 8px; border-radius: 6px; transition: color 0.2s, background 0.2s;
    }
    .copy-btn:hover { color: var(--accent); background: var(--accent-glow); }

    .btn-primary {
      width: 100%; padding: 1rem;
      background: linear-gradient(135deg, var(--accent), #0099cc);
      color: #000; font-weight: 700; font-size: 1rem;
      border-radius: 10px; letter-spacing: 0.02em; transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0,229,255,0.25);
      position: relative; overflow: hidden;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,229,255,0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    }

    .room-display {
      font-family: 'DM Mono', monospace; font-size: 0.8rem;
      color: var(--muted); text-align: center; margin-top: 0.8rem;
    }
    .room-display span { color: var(--accent); }

    #meeting {
      position: fixed; inset: 0; z-index: 20;
      background: var(--bg); display: flex; flex-direction: column;
      opacity: 0; pointer-events: none; transform: scale(1.03);
      transition: opacity var(--transition), transform var(--transition);
      overflow-y: auto;
    }
    #meeting.visible { opacity: 1; pointer-events: all; transform: scale(1); }

    .meet-topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.8rem 1.5rem; border-bottom: 1px solid var(--border);
      background: rgba(8,11,18,0.85); backdrop-filter: blur(12px);
      flex-shrink: 0; z-index: 5; position: sticky; top: 0;
    }
    .meet-logo { font-weight: 800; font-size: 1.1rem; }
    .meet-logo span { color: var(--accent); }
    .meet-room-id {
      font-family: 'DM Mono', monospace; font-size: 0.8rem;
      color: var(--muted); background: var(--surface);
      padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border);
    }
    .meet-time { font-family: 'DM Mono', monospace; font-size: 0.9rem; color: var(--muted); }

    .meet-body { flex: 1; display: flex; overflow: visible; }

    .video-area {
      flex: 1; position: relative;
      display: flex; align-items: flex-start; justify-content: center;
      min-height: 400px;
    }

    .video-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px; padding: 10px;
    }

    .video-tile {
      position: relative; border-radius: var(--radius);
      overflow: hidden; background: var(--surface);
      border: 1px solid var(--border); aspect-ratio: 16/9;
      animation: tileIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes tileIn {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }
    .video-tile video { width: 100%; height: 100%; object-fit: cover; display: block; }
    .video-tile .tile-label {
      position: absolute; bottom: 10px; left: 12px;
      font-family: 'DM Mono', monospace; font-size: 0.75rem;
      color: #fff; background: rgba(0,0,0,0.55);
      padding: 3px 10px; border-radius: 20px; backdrop-filter: blur(6px);
    }
    .video-tile .tile-muted {
      position: absolute; top: 10px; right: 10px;
      background: var(--danger); color: #fff;
      width: 28px; height: 28px; border-radius: 50%;
      display: none; align-items: center; justify-content: center; font-size: 13px;
    }
    .video-tile.muted .tile-muted { display: flex; }
    .video-tile .avatar-fallback {
      position: absolute; inset: 0;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: var(--surface2); gap: 10px;
    }
    .video-tile.cam-off .avatar-fallback { display: flex; }
    .video-tile.cam-off video { visibility: hidden; }
    .avatar-circle {
      width: 64px; height: 64px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 800; color: #fff;
    }
    .avatar-name { font-size: 0.85rem; color: var(--muted); }

    .sidebar {
      width: 260px; background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      transition: transform 0.3s, opacity 0.3s; flex-shrink: 0;
    }
    .sidebar.hidden-panel { transform: translateX(100%); opacity: 0; width: 0; overflow: hidden; }
    .sidebar-header {
      padding: 1rem 1.2rem 0.5rem; font-weight: 700; font-size: 0.85rem;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--muted); border-bottom: 1px solid var(--border);
    }
    .participant-list { padding: 0.5rem; overflow-y: auto; flex: 1; }
    .participant-item {
      display: flex; align-items: center; gap: 10px;
      padding: 0.6rem 0.8rem; border-radius: 8px; transition: background 0.15s;
    }
    .participant-item:hover { background: var(--surface2); }
    .p-avatar {
      width: 34px; height: 34px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
    }
    .p-name { font-size: 0.9rem; flex: 1; }
    .p-you { font-size: 0.7rem; color: var(--accent); font-family: 'DM Mono', monospace; }

    .controls {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 1rem 1.5rem; border-top: 1px solid var(--border);
      background: rgba(8,11,18,0.92); backdrop-filter: blur(12px);
      flex-shrink: 0; flex-wrap: wrap;
      position: sticky; bottom: 0;
    }
    .ctrl-btn {
      width: 52px; height: 52px; border-radius: 14px;
      background: var(--surface2); color: var(--text);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; border: 1px solid var(--border);
      transition: all 0.2s; position: relative;
    }
    .ctrl-btn:hover { background: var(--surface); border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
    .ctrl-btn.active { background: var(--accent); color: #000; border-color: transparent; box-shadow: 0 0 16px var(--accent-glow); }
    .ctrl-btn.danger { background: var(--danger); color: #fff; border-color: transparent; }
    .ctrl-btn.danger:hover { background: #e83b4a; }

    .ctrl-label {
      font-size: 0.65rem; color: var(--muted);
      position: absolute; bottom: -20px; white-space: nowrap;
      font-family: 'DM Mono', monospace;
    }
    .ctrl-group { position: relative; padding-bottom: 22px; }

    .invite-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.6rem 1rem;
      font-family: 'DM Mono', monospace; font-size: 0.78rem; color: var(--muted);
      cursor: pointer; transition: border-color 0.2s;
    }
    .invite-pill:hover { border-color: var(--accent); color: var(--accent); }
    .invite-pill svg { width: 16px; height: 16px; fill: currentColor; }

    .waiting-overlay {
      position: absolute; inset: 0;
      background: rgba(8,11,18,0.92); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; z-index: 10;
    }
    .waiting-overlay.hidden { display: none; }
    .spinner {
      width: 48px; height: 48px; border-radius: 50%;
      border: 3px solid var(--surface2); border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .waiting-text { font-size: 1.1rem; color: var(--muted); }

    .toast {
      position: fixed; bottom: 120px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 30px; padding: 0.6rem 1.4rem;
      font-size: 0.85rem; color: var(--text);
      opacity: 0; transition: all 0.3s; z-index: 100;
      pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .video-grid { grid-template-columns: 1fr; }
      .tagline { font-size: 2rem; }
      .card { padding: 1.5rem; }
      .controls { gap: 8px; }
      .ctrl-btn { width: 46px; height: 46px; font-size: 1.05rem; }
      .meet-topbar .meet-time { display: none; }
    }
    @media (max-width: 480px) {
      .invite-pill { display: none; }
    }
  </style>
</head>

<body>



  <section id="landing">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
        </svg>
      </div>
      <span class="logo-name">VIDEO! <span>Meet</span></span>
    </div>

    <h1 class="tagline"><marquee >Good choice</marquee></h1>
    

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="create">✦ Create Room</button>
        <button class="tab-btn" data-tab="join">⌥ Join Room</button>
      </div>

      <div id="tab-create" class="tab-panel active">
        <div class="input-group">
          <label>Your Name</label>
          <div class="input-wrap">
            <input id="create-name" type="text" placeholder="e.g. Alex Chen" maxlength="24" />
          </div>
        </div>
        <button class="btn-primary" id="btn-create">Generate Room &amp; Join →</button>
        <p class="room-display" id="room-preview" style="display:none;">
          Room: <span id="room-id-display"></span>
        </p>
      </div>

      <div id="tab-join" class="tab-panel">
        <div class="input-group">
          <label>Your Name</label>
          <div class="input-wrap">
            <input id="join-name" type="text" placeholder="e.g. Sam Rivera" maxlength="24" />
          </div>
        </div>
        <div class="input-group">
          <label>Room ID</label>
          <div class="input-wrap">
            <input id="join-room-id" type="text" placeholder="Paste room ID here" />
            <button class="copy-btn" id="paste-btn" title="Paste from clipboard">📋</button>
          </div>
        </div>
        <button class="btn-primary" id="btn-join">Join Meeting →</button>
      </div>
    </div>
  </section>

  <section id="meeting">
    <div class="meet-topbar">
      <span class="meet-logo">Nova<span>Meet</span></span>
      <span class="meet-room-id" id="meet-room-label">room / —</span>
      <span class="meet-time" id="meet-clock">00:00</span>
    </div>

    <div class="meet-body">
      <div class="video-area">
        <div class="waiting-overlay" id="waiting-overlay">
          <div class="spinner"></div>
          <p class="waiting-text">Waiting for participants…</p>
        </div>
        <div class="video-grid" id="video-grid"></div>
      </div>

      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">Participants (<span id="p-count">1</span>)</div>
        <div class="participant-list" id="participant-list"></div>
      </aside>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <button class="ctrl-btn active" id="btn-mute">🎤</button>
        <span class="ctrl-label">Mute</span>
      </div>
      <div class="ctrl-group">
        <button class="ctrl-btn active" id="btn-cam">📷</button>
        <span class="ctrl-label">Camera</span>
      </div>
      <button class="invite-pill" id="btn-copy-id">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92S19.61 16.08 18 16.08z"/></svg>
        Share Room ID
      </button>
      <div class="ctrl-group">
        <button class="ctrl-btn" id="btn-participants">👥</button>
        <span class="ctrl-label">People</span>
      </div>
      <div class="ctrl-group">
        <button class="ctrl-btn danger" id="btn-leave">✕</button>
        <span class="ctrl-label">Leave</span>
      </div>
    </div>
  </section>

  <div class="toast" id="toast"></div>

  <script>
  (() => {
    'use strict';

    const genRoomId = () => {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from({ length: 8 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    };

    const toastEl = document.getElementById('toast');
    let toastTimer;
    const showToast = (msg, duration = 2500) => {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), duration);
    };

    const state = {
      peer: null, localStream: null, roomId: null, myName: 'You',
      isMuted: false, isCamOff: false, connections: {}, participants: {},
      meetingStartTime: null, clockInterval: null,
    };

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(`tab-${btn.dataset.tab}`).classList.add('active');
      });
    });

    const parseHashRoom = () => {
      const match = location.hash.replace('#', '').match(/^room\/([a-z0-9]{4,16})$/i);
      return match ? match[1] : null;
    };

    const hashRoom = parseHashRoom();
    if (hashRoom) {
      document.getElementById('join-room-id').value = hashRoom;
      document.querySelectorAll('.tab-btn')[1].click();
      showToast(`Room ID prefilled: ${hashRoom}`);
    }

    document.getElementById('paste-btn').addEventListener('click', async () => {
      try {
        document.getElementById('join-room-id').value = (await navigator.clipboard.readText()).trim();
        showToast('Pasted from clipboard');
      } catch {
        showToast('Paste manually — clipboard blocked');
      }
    });

    const getMedia = async () => {
      try {
        return await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      } catch {
        try { return await navigator.mediaDevices.getUserMedia({ video: false, audio: true }); }
        catch { showToast('⚠ No camera/mic found.', 4000); return null; }
      }
    };

    const grid = document.getElementById('video-grid');
    const waitingOverlay = document.getElementById('waiting-overlay');

    const createVideoTile = (peerId, name, stream) => {
      const tile = document.createElement('div');
      tile.classList.add('video-tile');
      tile.dataset.peerId = peerId;

      const video = document.createElement('video');
      video.autoplay = true; video.playsInline = true;
      if (peerId === 'local') video.muted = true;
      if (stream) video.srcObject = stream;

      const label = document.createElement('div');
      label.classList.add('tile-label');
      label.textContent = peerId === 'local' ? `${name} (You)` : name;

      const mutedIcon = document.createElement('div');
      mutedIcon.classList.add('tile-muted');
      mutedIcon.textContent = '🔇';

      const fallback = document.createElement('div');
      fallback.classList.add('avatar-fallback');
      const circle = document.createElement('div');
      circle.classList.add('avatar-circle');
      circle.textContent = name.charAt(0).toUpperCase();
      const avName = document.createElement('div');
      avName.classList.add('avatar-name');
      avName.textContent = name;
      fallback.append(circle, avName);

      tile.append(video, label, mutedIcon, fallback);
      return tile;
    };

    const addTile = (peerId, name, stream) => {
      if (document.querySelector(`.video-tile[data-peer-id="${peerId}"]`)) return;
      grid.appendChild(createVideoTile(peerId, name, stream));
      const count = grid.querySelectorAll('.video-tile').length;
      waitingOverlay.classList.toggle('hidden', count >= 2);
      grid.style.gridTemplateColumns = count === 1 ? 'minmax(0, 640px)' : count <= 4 ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)';
    };

    const removeTile = (peerId) => {
      document.querySelector(`.video-tile[data-peer-id="${peerId}"]`)?.remove();
      const count = grid.querySelectorAll('.video-tile').length;
      waitingOverlay.classList.toggle('hidden', count >= 2);
      grid.style.gridTemplateColumns = count === 1 ? 'minmax(0, 640px)' : count <= 4 ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)';
    };

    const pList = document.getElementById('participant-list');
    const pCount = document.getElementById('p-count');

    const renderParticipants = () => {
      pList.innerHTML = '';
      const all = [
        { name: state.myName, isYou: true },
        ...Object.values(state.participants).map(p => ({ name: p.name, isYou: false }))
      ];
      pCount.textContent = all.length;
      all.forEach(({ name, isYou }) => {
        const item = document.createElement('div');
        item.classList.add('participant-item');
        item.innerHTML = `<div class="p-avatar">${name.charAt(0).toUpperCase()}</div><span class="p-name">${name}</span>${isYou ? '<span class="p-you">you</span>' : ''}`;
        pList.appendChild(item);
      });
    };

    const clockEl = document.getElementById('meet-clock');
    const startClock = () => {
      state.meetingStartTime = Date.now();
      state.clockInterval = setInterval(() => {
        const s = Math.floor((Date.now() - state.meetingStartTime) / 1000);
        clockEl.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      }, 1000);
    };

    const landing = document.getElementById('landing');
    const meetingEl = document.getElementById('meeting');

    const showMeeting = () => {
      landing.classList.add('hiding');
      setTimeout(() => { landing.style.display = 'none'; meetingEl.classList.add('visible'); startClock(); }, 380);
      history.replaceState(null, '', `#room/${state.roomId}`);
      document.getElementById('meet-room-label').textContent = `room / ${state.roomId}`;
    };

    const hideMeeting = () => {
      meetingEl.classList.remove('visible');
      setTimeout(() => { landing.style.display = ''; landing.classList.remove('hiding'); }, 380);
      history.replaceState(null, '', location.pathname);
      clearInterval(state.clockInterval);
    };

    const initPeer = (id) => new Promise((resolve, reject) => {
      const opts = { host: '0.peerjs.com', port: 443, path: '/', secure: true, debug: 0 };
      const peer = new Peer(id, opts);

      peer.on('open', () => { state.peer = peer; resolve(); });
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peer.destroy();
          const fb = new Peer(undefined, opts);
          fb.on('open', () => { state.peer = fb; resolve(); });
          fb.on('error', reject);
        } else reject(err);
      });

      peer.on('call', (call) => {
        call.answer(state.localStream);
        const pid = call.peer;
        call.on('stream', (stream) => {
          const name = state.participants[pid]?.name || pid.slice(0, 6);
          const el = document.querySelector(`.video-tile[data-peer-id="${pid}"] video`);
          if (el) el.srcObject = stream; else addTile(pid, name, stream);
          if (state.connections[pid]) state.connections[pid].call = call;
          else state.connections[pid] = { call };
          renderParticipants();
        });
        call.on('close', () => handlePeerDisconnect(pid));
        call.on('error', () => handlePeerDisconnect(pid));
      });

      peer.on('connection', (conn) => {
        const pid = conn.peer;
        conn.on('open', () => conn.send({ type: 'NAME', name: state.myName }));
        conn.on('data', (data) => handleDataMessage(pid, data));
        conn.on('close', () => handlePeerDisconnect(pid));
        if (!state.connections[pid]) state.connections[pid] = {};
        state.connections[pid].conn = conn;
      });
    });

    const handleDataMessage = (pid, data) => {
      if (data.type === 'NAME') {
        state.participants[pid] = { name: data.name };
        const lbl = document.querySelector(`.video-tile[data-peer-id="${pid}"] .tile-label`);
        if (lbl) lbl.textContent = data.name;
        const cir = document.querySelector(`.video-tile[data-peer-id="${pid}"] .avatar-circle`);
        if (cir) cir.textContent = data.name.charAt(0).toUpperCase();
        renderParticipants();

        if (state.localStream && !state.connections[pid]?.call) {
          const call = state.peer.call(pid, state.localStream);
          if (!state.connections[pid]) state.connections[pid] = {};
          state.connections[pid].call = call;
          call.on('stream', (stream) => {
            const name = state.participants[pid]?.name || pid.slice(0, 6);
            const el = document.querySelector(`.video-tile[data-peer-id="${pid}"] video`);
            if (el) el.srcObject = stream; else addTile(pid, name, stream);
            renderParticipants();
          });
          call.on('close', () => handlePeerDisconnect(pid));
        }

        if (!document.querySelector(`.video-tile[data-peer-id="${pid}"]`)) addTile(pid, data.name, null);
      }
      if (data.type === 'MUTED') document.querySelector(`.video-tile[data-peer-id="${pid}"]`)?.classList.toggle('muted', data.value);
      if (data.type === 'CAM_OFF') document.querySelector(`.video-tile[data-peer-id="${pid}"]`)?.classList.toggle('cam-off', data.value);
    };

    const handlePeerDisconnect = (pid) => {
      removeTile(pid);
      delete state.participants[pid];
      delete state.connections[pid];
      renderParticipants();
      showToast(`${pid.slice(0, 6)}… left the call`);
    };

    const connectToPeer = (hostId) => {
      const conn = state.peer.connect(hostId, { reliable: true });
      conn.on('open', () => {
        conn.send({ type: 'NAME', name: state.myName });
        if (!state.connections[hostId]) state.connections[hostId] = {};
        state.connections[hostId].conn = conn;
      });
      conn.on('data', (data) => handleDataMessage(hostId, data));
      conn.on('close', () => handlePeerDisconnect(hostId));
    };

    const broadcast = (msg) => {
      Object.values(state.connections).forEach(({ conn }) => { if (conn?.open) conn.send(msg); });
    };

    document.getElementById('btn-create').addEventListener('click', async () => {
      const name = document.getElementById('create-name').value.trim() || 'Host';
      state.myName = name;
      state.roomId = genRoomId();
      document.getElementById('room-preview').style.display = '';
      document.getElementById('room-id-display').textContent = state.roomId;
      showToast('Starting room…', 5000);
      try {
        state.localStream = await getMedia();
        await initPeer(state.roomId);
        addTile('local', name, state.localStream);
        renderParticipants();
        showMeeting();
        showToast(`Room ready — share ID: ${state.roomId}`, 4000);
      } catch (err) {
        console.error(err);
        showToast('Failed to start room. Check permissions.', 4000);
      }
    });

    document.getElementById('btn-join').addEventListener('click', async () => {
      const name = document.getElementById('join-name').value.trim() || 'Guest';
      const roomId = document.getElementById('join-room-id').value.trim();
      if (!roomId) { showToast('Enter a Room ID to join'); return; }
      state.myName = name; state.roomId = roomId;
      showToast('Joining room…', 5000);
      try {
        state.localStream = await getMedia();
        await initPeer(undefined);
        addTile('local', name, state.localStream);
        renderParticipants();
        showMeeting();
        connectToPeer(roomId);
        showToast(`Joined room: ${roomId}`, 3000);
      } catch (err) {
        console.error(err);
        showToast('Failed to join. Check ID & permissions.', 4000);
      }
    });

    document.getElementById('btn-mute').addEventListener('click', () => {
      state.isMuted = !state.isMuted;
      state.localStream?.getAudioTracks().forEach(t => t.enabled = !state.isMuted);
      const btn = document.getElementById('btn-mute');
      btn.textContent = state.isMuted ? '🔇' : '🎤';
      btn.classList.toggle('active', !state.isMuted);
      document.querySelector('.video-tile[data-peer-id="local"]')?.classList.toggle('muted', state.isMuted);
      broadcast({ type: 'MUTED', value: state.isMuted });
    });

    document.getElementById('btn-cam').addEventListener('click', () => {
      state.isCamOff = !state.isCamOff;
      state.localStream?.getVideoTracks().forEach(t => t.enabled = !state.isCamOff);
      const btn = document.getElementById('btn-cam');
      btn.textContent = state.isCamOff ? '🚫' : '📷';
      btn.classList.toggle('active', !state.isCamOff);
      document.querySelector('.video-tile[data-peer-id="local"]')?.classList.toggle('cam-off', state.isCamOff);
      broadcast({ type: 'CAM_OFF', value: state.isCamOff });
    });

    document.getElementById('btn-leave').addEventListener('click', () => {
      state.localStream?.getTracks().forEach(t => t.stop());
      Object.values(state.connections).forEach(({ conn, call }) => { try { conn?.close(); call?.close(); } catch {} });
      state.peer?.destroy();
      Object.assign(state, { peer: null, localStream: null, connections: {}, participants: {}, roomId: null, isMuted: false, isCamOff: false });
      grid.innerHTML = '';
      pList.innerHTML = '';
      waitingOverlay.classList.remove('hidden');
      const muteBtn = document.getElementById('btn-mute');
      muteBtn.textContent = '🎤'; muteBtn.classList.add('active');
      const camBtn = document.getElementById('btn-cam');
      camBtn.textContent = '📷'; camBtn.classList.add('active');
      clockEl.textContent = '00:00';
      hideMeeting();
      showToast('You left the meeting');
    });

    document.getElementById('btn-participants').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('hidden-panel');
    });

    document.getElementById('btn-copy-id').addEventListener('click', async () => {
      if (!state.roomId) return;
      try { await navigator.clipboard.writeText(state.roomId); showToast(`Copied: ${state.roomId}`); }
      catch { showToast(`Room ID: ${state.roomId}`, 4000); }
    });

    document.addEventListener('keydown', (e) => {
      if (!meetingEl.classList.contains('visible')) return;
      if (e.key === 'm' || e.key === 'M') document.getElementById('btn-mute').click();
      if (e.key === 'v' || e.key === 'V') document.getElementById('btn-cam').click();
    });

    window.addEventListener('hashchange', () => {
      const room = parseHashRoom();
      if (room && !meetingEl.classList.contains('visible')) {
        document.getElementById('join-room-id').value = room;
        document.querySelectorAll('.tab-btn')[1].click();
        showToast(`Room ID loaded: ${room}`);
      }
    });

  })();
  </script>

</body>
</html>

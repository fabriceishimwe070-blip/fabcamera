<!DOCTYPE html>
<html>
<head>
  <title>Video Call</title>
  <style>
    body { text-align: center; font-family: Arial; background: #f2f2f2; }
    video { width: 300px; margin: 10px; background: black; border-radius: 10px; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; }
  </style>
</head>
<body>

<h2>Video Call</h2>

<input id="room" placeholder="Enter Room ID">
<br>

<button onclick="startCall()">Start Call</button>
<button onclick="joinCall()">Join Call</button>

<br><br>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
let localStream;
let peer;
let currentCall;

const config = {
  config: {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  }
};

async function getMedia() {
  if (!localStream) {
    localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    document.getElementById("localVideo").srcObject = localStream;
  }
}

function startCall() {
  const room = document.getElementById("room").value;
  if (!room) return alert("Enter Room ID");

  peer = new Peer(room, config);

  peer.on("open", async () => {
    await getMedia();
    console.log("Host ready");
  });

  peer.on("call", (call) => {
    call.answer(localStream);

    call.on("stream", (remoteStream) => {
      document.getElementById("remoteVideo").srcObject = remoteStream;
    });

    currentCall = call;
  });

  peer.on("error", (err) => console.log(err));
}

async function joinCall() {
  const room = document.getElementById("room").value;
  if (!room) return alert("Enter Room ID");

  peer = new Peer(undefined, config);

  peer.on("open", async () => {
    await getMedia();

    const call = peer.call(room, localStream);

    call.on("stream", (remoteStream) => {
      document.getElementById("remoteVideo").srcObject = remoteStream;
    });

    currentCall = call;
  });

  peer.on("error", (err) => console.log(err));
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Firebase Video Call</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
    video { background: #000; border-radius: 10px; margin: 10px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

<h2>WebRTC Video Call</h2>

<video id="localVideo" autoplay playsinline width="300" muted></video>
<video id="remoteVideo" autoplay playsinline width="300"></video>

<br><br>

<button onclick="startCall()">Start Call</button>
<button onclick="joinCall()">Join Call</button>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCwibtCkdEl0sHBiFbgbImjYM3dWG1Kopg",
  authDomain: "web-cam-c4d2c.firebaseapp.com",
  projectId: "web-cam-c4d2c",
  storageBucket: "web-cam-c4d2c.firebasestorage.app",
  messagingSenderId: "984503419504",
  appId: "1:984503419504:web:6ce08f1fec6d0e4758aab5"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const roomId = prompt("Enter Room ID");

const servers = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

let pc;
let localStream;
let remoteStream;

function createPeer() {
  pc = new RTCPeerConnection(servers);

  remoteStream = new MediaStream();
  document.getElementById("remoteVideo").srcObject = remoteStream;

  pc.ontrack = (event) => {
    event.streams[0].getTracks().forEach(track => {
      remoteStream.addTrack(track);
    });
  };

  pc.onconnectionstatechange = () => {
    console.log("Connection:", pc.connectionState);
  };
}

async function getMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById("localVideo").srcObject = localStream;

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
}

async function startCall() {
  createPeer();
  await getMedia();

  const roomRef = db.collection("rooms").doc(roomId);

  const callerCandidates = roomRef.collection("callerCandidates");

  pc.onicecandidate = (event) => {
    if (event.candidate) callerCandidates.add(event.candidate.toJSON());
  };

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await roomRef.set({ offer });

  roomRef.onSnapshot(async snapshot => {
    const data = snapshot.data();
    if (data?.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
    }
  });

  roomRef.collection("calleeCandidates").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
      }
    });
  });
}

async function joinCall() {
  createPeer();
  await getMedia();

  const roomRef = db.collection("rooms").doc(roomId);

  const calleeCandidates = roomRef.collection("calleeCandidates");

  pc.onicecandidate = (event) => {
    if (event.candidate) calleeCandidates.add(event.candidate.toJSON());
  };

  const roomSnapshot = await roomRef.get();

  if (!roomSnapshot.exists) {
    alert("Room does not exist");
    return;
  }

  const data = roomSnapshot.data();

  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await roomRef.update({ answer });

  roomRef.collection("callerCandidates").onSnapshot(snapshot => {
    snapshot.docChanges().forEach(change => {
      if (change.type === "added") {
        pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
      }
    });
  });
}
</script>

</body>
</html>

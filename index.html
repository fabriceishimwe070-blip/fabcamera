<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Meeting</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <div><a href="home.html">go back</a></div>
<div class="card">
  <h1>
    <span><marquee direction="left">Nice</marquee></span>
    <span style="font-weight: 300; color: #2b7cff;"><marquee direction="right">Choice</marquee></span>
  </h1>

  <div class="actions">
    <button class="btn btn-primary" id="createBtn">✨ Create meeting</button>
    <button class="btn btn-outline" id="joinBtn">🔗 Join meeting</button>
  </div>

  
  <div class="link-area">
    <input type="text" id="meetingLink" placeholder="Meeting link appears here" readonly>
    <button class="btn" id="copyBtn">📋 Copy</button>
  </div>

  <div class="status-badge">
    <i></i>real time meet
  </div>

  <div class="footnote">
    <span>🔒 end‑to‑end encrypted</span>
    <span>👥 multi‑participant</span>
  </div>
</div>

<script>
  (function() {
    
    const meetingLinkInput = document.getElementById('meetingLink');
    const createBtn = document.getElementById('createBtn');
    const joinBtn = document.getElementById('joinBtn');
    const copyBtn = document.getElementById('copyBtn');

  
    let currentRoom = '';        
    const JITSI_DOMAIN = 'meet.jit.si';

   
    function generateRoomId() {
      const adjectives = ['sunny', 'coral', 'mellow', 'frost', 'ember', 'azure', 'breeze', 'cabin', 'dune', 'elm', 'fjord', 'grove', 'haze', 'ivy', 'jade', 'kite', 'luna', 'maple', 'nova', 'oasis', 'pixel', 'quill', 'ridge', 'sable', 'tide', 'umbra', 'vivid', 'wisp', 'yarn', 'zest'];
      const nouns = ['wave', 'peak', 'field', 'bridge', 'cloud', 'drift', 'echo', 'flame', 'glen', 'harbor', 'island', 'knoll', 'lodge', 'meadow', 'nook', 'orbit', 'palm', 'reef', 'spire', 'stone', 'tower', 'vista', 'wilder', 'cove', 'delta', 'brook', 'ridge', 'shade', 'vale', 'wood'];
      const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
      const noun = nouns[Math.floor(Math.random() * nouns.length)];
      const num = Math.floor(Math.random() * 999) + 10;
      return `${adj}-${noun}-${num}`;
    }

   
    function updateLinkDisplay(roomName) {
      if (!roomName) {
        meetingLinkInput.value = '';
        return;
      }
      const fullUrl = `https://${JITSI_DOMAIN}/${roomName}`;
      meetingLinkInput.value = fullUrl;
    }

    
    function openJitsiMeeting(roomName) {
      if (!roomName) return;
      
      const url = `https://${JITSI_DOMAIN}/${roomName}#config.startWithVideoMuted=false&config.startWithAudioMuted=false`;
    
      window.open(url, '_blank');
    }

   
    function createMeeting() {
      const room = generateRoomId();
      currentRoom = room;
      updateLinkDisplay(room);
     
      openJitsiMeeting(room);
    }

    
    function joinMeeting() {
      let rawLink = meetingLinkInput.value.trim();
      if (!rawLink) {
        
        createMeeting();
        return;
      }

     
      let roomName = '';
      try {
        if (rawLink.startsWith('http://') || rawLink.startsWith('https://')) {
          const urlObj = new URL(rawLink);
          
          if (urlObj.hostname === JITSI_DOMAIN || urlObj.hostname.endsWith('.' + JITSI_DOMAIN)) {
            roomName = urlObj.pathname.replace(/^\/+/, '').replace(/\/+$/, '');
          } else {
           
            roomName = rawLink.split('/').pop().split('#')[0].split('?')[0];
          }
        } else {
          
          roomName = rawLink.split('/').pop().split('#')[0].split('?')[0];
        }
      } catch (_) {
        
        roomName = rawLink.replace(/[^a-zA-Z0-9\-_]/g, '-');
      }

     
      if (!roomName) {
        
        roomName = generateRoomId();
      }
     
      roomName = roomName.replace(/[^a-zA-Z0-9\-_]/g, '-').substring(0, 60);

      currentRoom = roomName;
      
      updateLinkDisplay(roomName);
      
      openJitsiMeeting(roomName);
    }

   
    function copyLink() {
      const link = meetingLinkInput.value.trim();
      if (!link) {
        
        createMeeting();
        
        setTimeout(() => {
          if (meetingLinkInput.value) {
            meetingLinkInput.select();
            navigator.clipboard.writeText(meetingLinkInput.value).catch(() => {});
          }
        }, 50);
        return;
      }
      meetingLinkInput.select();
      navigator.clipboard.writeText(link).catch(() => {
        
        document.execCommand('copy');
      });
      const original = copyBtn.textContent;
      copyBtn.textContent = '✅ Copied';
      setTimeout(() => { copyBtn.textContent = original; }, 1200);
    }

   
    createBtn.addEventListener('click', createMeeting);

    joinBtn.addEventListener('click', joinMeeting);

    copyBtn.addEventListener('click', copyLink);

   
    meetingLinkInput.addEventListener('focus', function() {
      this.select();
    });

   
    meetingLinkInput.placeholder = 'your meeting link appears here';

    
    meetingLinkInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        joinMeeting();
      }
    });
    console.log('✅ Jitsi meeting app ready · no backend');
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAB-CAMERA</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --border: rgba(255,255,255,0.07);
      --accent: #6c63ff;
      --accent2: #00e5ff;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --call: #22c55e;
      --end: #ef4444;
      --radius: 14px;
    }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      padding: 20px;
      position: relative;
      
    }

    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -150px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0,229,255,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    header {
      width: 100%;
      max-width: 460px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0 18px 0;
    }

    .logo {
      font-family: 'Space Mono', monospace;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.18em;
      color: var(--accent2);
      text-transform: uppercase;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 5px 12px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--muted);
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
    }
    .status-badge.online .status-dot { background: var(--call); }
    .status-badge.online span { color: var(--call); }

    .box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      padding: 28px 28px 24px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .section-title {
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .id-row {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      gap: 10px;
      margin-bottom: 12px;
    }

    .id-text {
      flex: 1;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--accent2);
      letter-spacing: 0.05em;
      word-break: break-all;
      min-height: 18px;
    }

    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 3px;
      border-radius: 6px;
      transition: color 0.2s;
      flex-shrink: 0;
    }
    .copy-btn:hover { color: var(--accent2); }

    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .btn {
      flex: 1;
      padding: 11px 0;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      letter-spacing: 0.02em;
    }
    .btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-call { background: var(--call); color: #fff; }
    .btn-end { background: var(--end); color: #fff; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 4px 0 20px;
    }

    input[type="text"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: var(--text);
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"]:focus { border-color: var(--accent); }

    .ctrl-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .ctrl-btn {
      flex: 1;
      padding: 9px 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      letter-spacing: 0.01em;
    }
    .ctrl-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .ctrl-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Meet generator section */
    .meet-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      padding: 24px 28px 20px;
      margin-top: 14px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.4);
    }

    .meet-section .section-title {
      margin-bottom: 14px;
    }

    .meet-link-row {
      display: flex;
      align-items: center;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      gap: 8px;
      margin-bottom: 14px;
    }

    .meet-link-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--accent2);
      letter-spacing: 0.04em;
      min-width: 0;
    }
    .meet-link-input::placeholder { color: var(--muted); }

    .meet-btns {
      display: flex;
      gap: 8px;
    }

    .meet-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .meet-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .meet-btn-create { background: var(--accent); color: #fff; }
    .meet-btn-copy { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
    .meet-btn-join { background: linear-gradient(135deg, var(--accent2), #0099ff); color: #0a0a0f; font-weight: 700; }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--surface2);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 10px 22px;
      border-radius: 100px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="logo">ISHIMWE</div>
  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">Offline</span>
  </div>
</header>

<!-- FAB-CAMERA peer section -->
<div class="box">

  
  

<!-- Meet generator section -->
<div class="meet-section">

  <div class="section-title">Create or Join a Meeting</div>

  <div class="meet-link-row">
    <input class="meet-link-input" type="text" id="meetLink" readonly placeholder="Click 'Create' to generate a link…">
    <button class="copy-btn" onclick="copyMeetLink()" title="Copy link">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
    </button>
  </div>

  <div class="meet-btns">
    <button class="meet-btn meet-btn-create" onclick="createMeet()">Create</button>
    <button class="meet-btn meet-btn-copy" onclick="copyMeetLink()">Copy</button>
    <button class="meet-btn meet-btn-join" onclick="joinMeet()">Join →</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
  let peer = null;
  let localStream = null;
  let isMuted = false, isVideoOff = false;
  const activeCalls = new Map();
  const pendingCalls = [];

  const ICE_CONFIG = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" }
    ]
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  async function startPeer() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      peer = new Peer(undefined, { config: ICE_CONFIG });

      peer.on('open', id => {
        document.getElementById('myId').textContent = id;
        document.getElementById('callBtn').disabled = false;
        document.getElementById('endBtn').disabled = false;
        document.getElementById('muteBtn').disabled = false;
        document.getElementById('videoBtn').disabled = false;
        document.getElementById('statusBadge').classList.add('online');
        document.getElementById('statusText').textContent = 'Online';
        showToast('Camera started! Your Peer ID is ready.');
      });

      peer.on('call', call => {
        pendingCalls.push(call);
        showToast('Incoming call from: ' + call.peer);
      });

    } catch (err) {
      showToast('Could not access camera/mic: ' + err.message);
    }
  }

  function callPeer() {
    const id = document.getElementById('peerId').value.trim();
    if (!id) return showToast('Enter a Peer ID first');
    const call = peer.call(id, localStream);
    setupCall(call);
    showToast('Calling ' + id + '…');
  }

  function setupCall(call) {
    activeCalls.set(call.peer, call);
    call.on('stream', remoteStream => {
      showToast('Connected to ' + call.peer);
    });
    call.on('close', () => {
      activeCalls.delete(call.peer);
      showToast('Call ended with ' + call.peer);
    });
  }

  function toggleMute() {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    const btn = document.getElementById('muteBtn');
    btn.textContent = isMuted ? 'Unmute' : 'Mute';
    btn.classList.toggle('active', isMuted);
    showToast(isMuted ? 'Microphone muted' : 'Microphone on');
  }

  function toggleVideo() {
    if (!localStream) return;
    isVideoOff = !isVideoOff;
    localStream.getVideoTracks().forEach(t => t.enabled = !isVideoOff);
    const btn = document.getElementById('videoBtn');
    btn.textContent = isVideoOff ? 'Show Video' : 'Video';
    btn.classList.toggle('active', isVideoOff);
    showToast(isVideoOff ? 'Camera off' : 'Camera on');
  }

  function endAllCalls() {
    activeCalls.forEach(c => c.close());
    activeCalls.clear();
    showToast('All calls ended');
  }

  function copyId() {
    const id = document.getElementById('myId').textContent;
    if (id === '—') return showToast('No ID yet — start camera first');
    navigator.clipboard.writeText(id).then(() => showToast('Peer ID copied!'));
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
    } else {
      document.exitFullscreen();
    }
  }

  // Meet functions
  function createMeet() {
    const rand = s => Math.random().toString(36).substring(2, 2 + s);
    const code = rand(3) + '-' + rand(4) + '-' + rand(3);
    const link = 'https://meet.google.com/' + code;
    document.getElementById('meetLink').value = link;
    showToast('Meeting link created!');
  }

  function copyMeetLink() {
    const val = document.getElementById('meetLink').value;
    if (!val) return showToast('Create a meeting link first');
    navigator.clipboard.writeText(val).then(() => showToast('Link copied!'));
  }

  function joinMeet() {
    const link = document.getElementById('meetLink').value;
    if (!link) return showToast('Create a meeting link first');
    window.open(link, '_blank');
  }
</script>

</body>
</html>

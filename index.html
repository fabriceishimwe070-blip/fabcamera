<!DOCTYPE html>
<html>
<head>
  <title>Stable WebRTC Firebase Call</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f0f0f0; }
    video { background: black; border-radius: 10px; margin: 10px; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>

<h2>Stable Video Call</h2>

<video id="localVideo" autoplay playsinline muted width="300"></video>
<video id="remoteVideo" autoplay playsinline width="300"></video>

<br>

<button onclick="startCall()">Start Call</button>
<button onclick="joinCall()">Join Call</button>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyCwibtCkdEl0sHBiFbgbImjYM3dWG1Kopg",
  authDomain: "web-cam-c4d2c.firebaseapp.com",
  projectId: "web-cam-c4d2c",
});

const db = firebase.firestore();
const roomId = prompt("Room ID");

let pc;
let localStream;
let remoteStream;
let iceQueue = [];

const servers = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" },

    {
      urls: "turn:relay1.expressturn.com:3478",
      username: "openrelayproject",
      credential: "openrelayproject"
    }
  ],
  iceCandidatePoolSize: 20
};

function createPeer() {
  pc = new RTCPeerConnection(servers);

  remoteStream = new MediaStream();
  document.getElementById("remoteVideo").srcObject = remoteStream;

  pc.ontrack = e => {
    e.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
  };

  pc.onicecandidate = e => {
    if (!e.candidate) return;
    if (window.sendCandidate) window.sendCandidate(e.candidate.toJSON());
  };

  pc.onconnectionstatechange = () => {
    console.log("STATE:", pc.connectionState);
  };
}

async function startCall() {
  createPeer();

  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById("localVideo").srcObject = localStream;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  const roomRef = db.collection("rooms").doc(roomId);

  window.sendCandidate = (c) => roomRef.collection("callerCandidates").add(c);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  await roomRef.set({ offer });

  roomRef.onSnapshot(async snap => {
    const data = snap.data();
    if (data?.answer && !pc.currentRemoteDescription) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.answer));

      iceQueue.forEach(c => pc.addIceCandidate(new RTCIceCandidate(c)));
      iceQueue = [];
    }
  });

  roomRef.collection("calleeCandidates").onSnapshot(snap => {
    snap.docChanges().forEach(change => {
      if (change.type === "added") {
        const c = change.doc.data();
        if (pc.remoteDescription) {
          pc.addIceCandidate(new RTCIceCandidate(c));
        } else {
          iceQueue.push(c);
        }
      }
    });
  });
}

async function joinCall() {
  createPeer();

  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById("localVideo").srcObject = localStream;
  localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  const roomRef = db.collection("rooms").doc(roomId);

  window.sendCandidate = (c) => roomRef.collection("calleeCandidates").add(c);

  const roomSnap = await roomRef.get();
  if (!roomSnap.exists) return alert("Room not found");

  const offer = roomSnap.data().offer;

  await pc.setRemoteDescription(new RTCSessionDescription(offer));

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);

  await roomRef.update({ answer });

  roomRef.collection("callerCandidates").onSnapshot(snap => {
    snap.docChanges().forEach(change => {
      if (change.type === "added") {
        const c = change.doc.data();
        if (pc.remoteDescription) {
          pc.addIceCandidate(new RTCIceCandidate(c));
        } else {
          iceQueue.push(c);
        }
      }
    });
  });
}
</script>

</body>
</html>

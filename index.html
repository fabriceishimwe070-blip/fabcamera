<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PeerLink — Video Call</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --panel: #1a1a26;
      --border: #2a2a40;
      --accent: #5b4fff;
      --accent2: #ff4f9a;
      --green: #00e5a0;
      --text: #e8e8f0;
      --muted: #7070a0;
      --danger: #ff4b4b;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* Animated background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(91,79,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(91,79,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Glow orbs */
    body::after {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(91,79,255,0.15) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      padding: 0 20px 60px;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 0 36px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 6px 14px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      transition: all 0.3s;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: all 0.3s;
    }

    .status-badge.connected .status-dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    .status-badge.connected { color: var(--green); border-color: rgba(0,229,160,0.3); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Setup panel */
    .setup-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px;
      margin-bottom: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: end;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .id-display {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 48px;
      gap: 10px;
    }

    .id-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      flex-shrink: 0;
    }

    .copy-btn:hover { color: var(--accent); background: rgba(91,79,255,0.1); }

    input[type="text"] {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--text);
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      min-height: 48px;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(91,79,255,0.15);
    }

    input[type="text"]::placeholder { color: var(--muted); }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
      flex: 1;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #7b6aff);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(91,79,255,0.4);
    }

    .btn-call {
      background: linear-gradient(135deg, var(--green), #00c888);
      color: #001a10;
    }

    .btn-call:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,229,160,0.35);
    }

    .btn-end {
      background: linear-gradient(135deg, var(--danger), #ff2222);
      color: white;
    }

    .btn-end:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,75,75,0.4);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn svg { flex-shrink: 0; }

    /* Video area */
    .video-stage {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      aspect-ratio: 16/9;
      width: 100%;
    }

    #remoteVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: var(--surface);
    }

    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--muted);
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .empty-state svg { opacity: 0.3; }

    .empty-state p {
      font-size: 15px;
      font-weight: 600;
      opacity: 0.5;
    }

    .empty-state small {
      font-size: 12px;
      opacity: 0.35;
      font-family: 'Space Mono', monospace;
    }

    .empty-state.hidden { opacity: 0; }

    /* PiP local video */
    .local-pip {
      position: absolute;
      bottom: 18px;
      right: 18px;
      width: 160px;
      aspect-ratio: 4/3;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      background: #000;
      z-index: 10;
      transition: all 0.3s;
    }

    .local-pip:hover { transform: scale(1.04); }

    #localVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);
    }

    .pip-label {
      position: absolute;
      bottom: 6px;
      left: 8px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.7);
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
    }

    /* Controls bar */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 20px 0 0;
    }

    .ctrl-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(91,79,255,0.1); }
    .ctrl-btn.active { background: var(--danger); border-color: var(--danger); color: white; }
    .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 12px 22px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      z-index: 1000;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.5);
    }

    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: rgba(0,229,160,0.4); color: var(--green); }
    .toast.error { border-color: rgba(255,75,75,0.4); color: var(--danger); }

    /* Incoming call overlay */
    .incoming-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      z-index: 500;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .incoming-overlay.show { display: flex; }

    .incoming-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 48px;
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
    }

    @keyframes popIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .ring-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: ring 1.2s ease-in-out infinite;
    }

    @keyframes ring {
      0%, 100% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
    }

    .incoming-card h3 {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .incoming-card p {
      font-size: 13px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      margin-bottom: 28px;
    }

    .incoming-actions { display: flex; gap: 14px; justify-content: center; }

    .btn-accept {
      background: linear-gradient(135deg, var(--green), #00c888);
      color: #001a10;
      padding: 14px 28px;
      border-radius: 100px;
      border: none;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-accept:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(0,229,160,0.4); }

    .btn-decline {
      background: rgba(255,75,75,0.15);
      color: var(--danger);
      border: 1px solid rgba(255,75,75,0.3);
      padding: 14px 28px;
      border-radius: 100px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-decline:hover { background: rgba(255,75,75,0.25); }

    @media (max-width: 600px) {
      .setup-panel { grid-template-columns: 1fr; }
      .local-pip { width: 110px; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">PeerLink</div>
    <div class="status-badge" id="statusBadge">
      <div class="status-dot"></div>
      <span id="statusText">Offline</span>
    </div>
  </header>

  <!-- Setup Panel -->
  <div class="setup-panel">
    <div class="field-group">
      <label>Your Peer ID</label>
      <div class="id-display">
        <span class="id-text" id="myId">—</span>
        <button class="copy-btn" onclick="copyId()" title="Copy ID">
          <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="startBtn" onclick="startPeer()">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/></svg>
          Start Camera
        </button>
      </div>
    </div>

    <div class="field-group">
      <label>Call Someone</label>
      <input type="text" id="peerId" placeholder="Paste friend's Peer ID…">
      <div class="btn-row">
        <button class="btn btn-call" id="callBtn" onclick="callPeer()" disabled>
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          Call
        </button>
        <button class="btn btn-end" id="endBtn" onclick="endCall()" disabled>
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12 12 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.43 19.43 0 0 1-3.61-3.61m-1.72-6.1A19.79 19.79 0 0 1 2 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12 12 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91M23 1 1 23"/></svg>
          End
        </button>
      </div>
    </div>
  </div>

  <!-- Video Stage -->
  <div class="video-stage">
    <video id="remoteVideo" autoplay playsinline></video>

    <div class="empty-state" id="emptyState">
      <svg width="56" height="56" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
      </svg>
      <p>No active call</p>
      <small>Start camera, then call a peer to connect</small>
    </div>

    <div class="local-pip" id="localPip" style="display:none">
      <video id="localVideo" autoplay muted playsinline></video>
      <div class="pip-label">You</div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-bar">
    <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()" disabled title="Mute mic">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="videoBtn" onclick="toggleVideo()" disabled title="Camera on/off">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/>
      </svg>
    </button>
    <button class="ctrl-btn" id="fullscreenBtn" onclick="toggleFullscreen()" title="Fullscreen">
      <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
    </button>
  </div>
</div>

<!-- Incoming Call Overlay -->
<div class="incoming-overlay" id="incomingOverlay">
  <div class="incoming-card">
    <div class="ring-icon">
      <svg width="36" height="36" fill="white" viewBox="0 0 24 24">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
    </div>
    <h3>Incoming Call</h3>
    <p id="callerIdText">Unknown caller</p>
    <div class="incoming-actions">
      <button class="btn-accept" onclick="acceptCall()">Accept</button>
      <button class="btn-decline" onclick="declineCall()">Decline</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
  let peer, localStream, activeCall, pendingCall;
  let isMuted = false, isVideoOff = false;

  // ── Toast ──────────────────────────────────────────────
  function showToast(msg, type = '') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (type ? ' ' + type : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── Start Peer ─────────────────────────────────────────
  async function startPeer() {
    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.textContent = 'Starting…';

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('localVideo').srcObject = localStream;
      document.getElementById('localPip').style.display = 'block';

      peer = new Peer();

      peer.on('open', (id) => {
        document.getElementById('myId').textContent = id;
        setStatus('connected', 'Ready');
        document.getElementById('callBtn').disabled = false;
        document.getElementById('muteBtn').disabled = false;
        document.getElementById('videoBtn').disabled = false;
        btn.textContent = '✓ Camera On';
        showToast('Camera ready! Share your ID to receive calls.', 'success');
      });

      peer.on('call', (call) => {
        pendingCall = call;
        document.getElementById('callerIdText').textContent = call.peer;
        document.getElementById('incomingOverlay').classList.add('show');
      });

      peer.on('error', (err) => {
        showToast('Peer error: ' + err.type, 'error');
        console.error(err);
      });

    } catch (err) {
      btn.disabled = false;
      btn.innerHTML = `<svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M15 10l4.553-2.069A1 1 0 0 1 21 8.845v6.31a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z"/></svg> Start Camera`;
      showToast('Camera access denied.', 'error');
    }
  }

  // ── Call ───────────────────────────────────────────────
  function callPeer() {
    const id = document.getElementById('peerId').value.trim();
    if (!id) { showToast('Enter a Peer ID to call.', 'error'); return; }
    if (!peer || !localStream) { showToast('Start camera first.', 'error'); return; }

    const call = peer.call(id, localStream);
    if (!call) { showToast('Could not reach that peer.', 'error'); return; }

    activeCall = call;
    setupCallHandlers(call);
    setStatus('connected', 'Calling…');
    showToast('Calling ' + id + '…');

    document.getElementById('callBtn').disabled = true;
    document.getElementById('endBtn').disabled = false;
  }

  // ── Accept / Decline ───────────────────────────────────
  function acceptCall() {
    document.getElementById('incomingOverlay').classList.remove('show');
    if (!pendingCall) return;
    pendingCall.answer(localStream);
    activeCall = pendingCall;
    setupCallHandlers(pendingCall);
    pendingCall = null;
    document.getElementById('endBtn').disabled = false;
    document.getElementById('callBtn').disabled = true;
    showToast('Call connected!', 'success');
  }

  function declineCall() {
    document.getElementById('incomingOverlay').classList.remove('show');
    pendingCall = null;
    showToast('Call declined.');
  }

  // ── Stream Handlers ────────────────────────────────────
  function setupCallHandlers(call) {
    call.on('stream', (remoteStream) => {
      const rv = document.getElementById('remoteVideo');
      rv.srcObject = remoteStream;
      rv.play().catch(() => {});
      document.getElementById('emptyState').classList.add('hidden');
      setStatus('connected', 'In call');
      showToast('Connected!', 'success');
    });

    call.on('close', () => {
      hangupUI();
      showToast('Call ended.');
    });

    call.on('error', (err) => {
      hangupUI();
      showToast('Call error: ' + err, 'error');
    });
  }

  // ── End Call ───────────────────────────────────────────
  function endCall() {
    if (activeCall) activeCall.close();
    hangupUI();
    showToast('Call ended.');
  }

  function hangupUI() {
    document.getElementById('remoteVideo').srcObject = null;
    document.getElementById('emptyState').classList.remove('hidden');
    document.getElementById('endBtn').disabled = true;
    document.getElementById('callBtn').disabled = false;
    activeCall = null;
    setStatus('connected', 'Ready');
  }

  // ── Controls ───────────────────────────────────────────
  function toggleMute() {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
    document.getElementById('muteBtn').classList.toggle('active', isMuted);
    showToast(isMuted ? 'Microphone muted' : 'Microphone on');
  }

  function toggleVideo() {
    if (!localStream) return;
    isVideoOff = !isVideoOff;
    localStream.getVideoTracks().forEach(t => t.enabled = !isVideoOff);
    document.getElementById('videoBtn').classList.toggle('active', isVideoOff);
    showToast(isVideoOff ? 'Camera off' : 'Camera on');
  }

  function toggleFullscreen() {
    const stage = document.querySelector('.video-stage');
    if (!document.fullscreenElement) {
      stage.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen();
    }
  }

  // ── Copy ID ────────────────────────────────────────────
  function copyId() {
    const id = document.getElementById('myId').textContent;
    if (id === '—') { showToast('Start camera to get your ID first.', 'error'); return; }
    navigator.clipboard.writeText(id).then(() => showToast('ID copied!', 'success'));
  }

  // ── Status ─────────────────────────────────────────────
  function setStatus(type, text) {
    const badge = document.getElementById('statusBadge');
    const label = document.getElementById('statusText');
    badge.className = 'status-badge ' + type;
    label.textContent = text;
  }
</script>
</body>
</html>

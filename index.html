<!DOCTYPE html>
<html>
<head>
  <title>Video Call</title>
  <style>
    body { text-align: center; font-family: Arial; background: #f2f2f2; }
    video { width: 300px; margin: 10px; background: black; border-radius: 10px; }
    input, button { padding: 10px; margin: 5px; font-size: 16px; }
  </style>
</head>
<body>

<h2>WebRTC Video Call</h2>

<input id="room" placeholder="Enter Room ID">
<br>

<button onclick="startCall()">Start Call</button>
<button onclick="joinCall()">Join Call</button>

<br><br>

<video id="localVideo" autoplay muted playsinline></video>
<video id="remoteVideo" autoplay playsinline></video>

<script>
let localStream;
let pc;
let ws;
let room;

const config = {
  iceServers: [
    { urls: "stun:stun.l.google.com:19302" }
  ]
};

async function getMedia() {
  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
  document.getElementById("localVideo").srcObject = localStream;
}

function connectWS() {
  console.log("Connecting WebSocket...");

  ws = new WebSocket("wss://fabcamera.onrender.com");

  ws.onopen = () => {
    console.log("WS CONNECTED");
    ws.send(JSON.stringify({ type: "join", room }));
  };

  ws.onerror = (e) => {
    console.log("WS ERROR", e);
  };

  ws.onclose = () => {
    console.log("WS CLOSED");
  };

  ws.onmessage = async (message) => {
    const data = JSON.parse(message.data);
    console.log("WS MESSAGE:", data);

    if (!pc) return;

    if (data.offer) {
      console.log("OFFER RECEIVED");

      await pc.setRemoteDescription(data.offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);

      ws.send(JSON.stringify({ type: "signal", room, answer }));
    }

    if (data.answer) {
      console.log("ANSWER RECEIVED");
      await pc.setRemoteDescription(data.answer);
    }

    if (data.candidate) {
      try {
        await pc.addIceCandidate(data.candidate);
      } catch (e) {
        console.log("ICE ERROR", e);
      }
    }
  };
}

function createPeer() {
  pc = new RTCPeerConnection(config);

  localStream.getTracks().forEach(track => {
    pc.addTrack(track, localStream);
  });

  pc.ontrack = (event) => {
    document.getElementById("remoteVideo").srcObject = event.streams[0];
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      ws.send(JSON.stringify({
        type: "signal",
        room,
        candidate: event.candidate
      }));
    }
  };
}

async function startCall() {
  console.log("START CLICKED");

  room = document.getElementById("room").value;
  if (!room) return alert("Enter Room ID");

  await getMedia();
  connectWS();
  createPeer();

  ws.onopen = async () => {
    console.log("JOINING ROOM (HOST)");

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    ws.send(JSON.stringify({ type: "join", room }));

    ws.send(JSON.stringify({
      type: "signal",
      room,
      offer
    }));
  };
}

async function joinCall() {
  console.log("JOIN CLICKED");

  room = document.getElementById("room").value;
  if (!room) return alert("Enter Room ID");

  await getMedia();
  connectWS();
  createPeer();

  ws.onopen = () => {
    console.log("JOINING ROOM (GUEST)");
    ws.send(JSON.stringify({ type: "join", room }));
  };
}
</script>

</body>
</html>
